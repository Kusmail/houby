<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=../">
<title>Houbař</title>
<style>body{margin:0;padding:24px 16px;font:17px/1.45 -apple-system,system-ui,sans-serif;background:#f6f2e9;color:#1c1a14}a{color:#2e5c3a;font-weight:700}</style>
</head>
<body>
<!-- Zkušební adresa nové appky skončila: nová appka je na hlavní adrese. -->
<p><b>Nová appka už je na hlavní adrese.</b></p>
<p><a href="../">Otevřít Houbaře</a>. Ikonu „Houbař N" z plochy můžeš smazat.</p>
<script>
/* Odhlásit starý service worker zkušební adresy a smazat jeho skořápky (nova-v*),
   pak teprve přesměrovat. Kdyby něco viselo, přesměruje se po vteřině a půl tak jako tak. */
(async () => {
  try {
    if ('serviceWorker' in navigator)
      for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/nova\/$/.test(r.scope)) await r.unregister();
    if (window.caches)
      for (const k of await caches.keys()) if (/^nova-v[0-9a-z]+-/.test(k)) await caches.delete(k);
  } catch(e){}
  location.replace('../');
})();
setTimeout(() => location.replace('../'), 1500);
</script>
</body>
</html>
